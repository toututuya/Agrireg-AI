name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Spring Boot API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build API
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  web:
    name: Vue Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm build

  agent:
    name: LangGraph Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install Agent
        run: python -m pip install -e ".[dev]"
      - name: Run Agent tests
        run: pytest
      - name: Evaluate deterministic routing contract
        run: python evaluation/run_eval.py

  evaluation:
    name: Evaluation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile evaluation scripts
        run: >-
          python -m py_compile
          evaluation/build_external_gold.py
          evaluation/compare_direct_vs_graphrag.py
          evaluation/finalize_external_gold.py
          evaluation/generate_dataset.py
          evaluation/run_eval.py
