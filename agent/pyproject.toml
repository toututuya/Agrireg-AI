[project]
name = "agrireg-agent"
version = "0.1.0"
description = "Stateful LangGraph agent for evidence-grounded pesticide analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
documents = [
  "pymilvus>=2.6.3,<2.7",
  "sentence-transformers>=4.1,<6"
]
mcp = ["mcp>=1.25,<2"]
tokenizer = ["transformers==4.55.4", "jinja2>=3.1,<4"]
training = [
  "torch>=2.5,<3",
  "transformers==4.55.4",
  "peft==0.17.1",
  "accelerate==1.10.1"
]
training-4bit = ["bitsandbytes==0.46.1"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7"
]

[project.scripts]
agrireg-agent = "agrireg_agent.api:run"
agrireg-documents = "agrireg_agent.documents:main"
agrireg-mcp = "agrireg_agent.mcp_server:main"
agrireg-planner-sft = "agrireg_agent.planner_sft:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

